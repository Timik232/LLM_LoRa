services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile_ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./models:/app/models
    environment:
      - OLLAMA_MODELS=/app/models
    runtime: nvidia
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434" ]
      interval: 10s
      timeout: 5s
      retries: 5

  llm_training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_training
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./conf:/app/conf
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    runtime: nvidia
    networks:
      - mlflow-network

volumes:
  ollama_models:

networks:
  mlflow-network:
    external: true
